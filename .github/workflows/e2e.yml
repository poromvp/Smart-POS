name: End-to-End Tests (Smart POS)

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  e2e:
    name: Full-Stack Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      POSTGRES_USER: pos_admin
      POSTGRES_PASSWORD: pos_password123
      AUTH_DB_PORT: 5434
      CATALOG_DB_URL: jdbc:postgresql://localhost:5434/pos_catalog_inventory_db
      SALES_DB_URL: jdbc:postgresql://127.0.0.1:5434/pos_sales_db
      SPRING_PROFILES_ACTIVE: dev
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      INTERNAL_SERVICE_SECRET: smartpos-internal-secret-2026
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_LOGIN_MAX_REQUESTS: "40"
      RATE_LIMIT_ORDER_MAX_REQUESTS: "60"
      API_GATEWAY_URL: http://localhost:8088
      NEXT_PUBLIC_WS_URL: ws://localhost:8088/ws-pos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache Frontend & E2E npm dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-node-pw-${{ hashFiles('frontend/package-lock.json', 'e2e/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-pw-

      - name: Start clean PostgreSQL E2E container (port 5434)
        run: docker compose -f docker-compose.e2e.yml up -d --wait

      - name: Build Backend Services & Gateway
        run: chmod +x backend/mvnw && backend/mvnw -f backend/pom.xml -DskipTests package

      - name: Install & Build Frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Install E2E dependencies & Playwright Chromium
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Start Backend Services, Gateway & Frontend
        run: |
          mkdir -p e2e/logs
          AUTH_JAR=$(find backend/services/auth-service/target -maxdepth 1 -name "*.jar" ! -name "*-plain.jar" | head -n 1)
          CAT_JAR=$(find backend/services/catalog-inventory-service/target -maxdepth 1 -name "*.jar" ! -name "*-plain.jar" | head -n 1)
          SALES_JAR=$(find backend/services/sales-service/target -maxdepth 1 -name "*.jar" ! -name "*-plain.jar" | head -n 1)
          GW_JAR=$(find backend/gateway/target -maxdepth 1 -name "*.jar" ! -name "*-plain.jar" | head -n 1)

          nohup java -jar "$AUTH_JAR" > e2e/logs/auth-service.log 2>&1 &
          nohup java -jar "$CAT_JAR" > e2e/logs/catalog-inventory-service.log 2>&1 &
          nohup java -jar "$SALES_JAR" > e2e/logs/sales-service.log 2>&1 &
          nohup java -jar "$GW_JAR" > e2e/logs/gateway.log 2>&1 &
          nohup npm --prefix frontend run start > e2e/logs/frontend.log 2>&1 &

      - name: Wait for all services to be healthy
        run: node e2e/scripts/wait-for-stack.mjs

      - name: Run Playwright E2E suite
        working-directory: e2e
        run: npm run test:e2e

      - name: Upload Playwright reports, traces & service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/logs/
          retention-days: 14

      - name: Tear down E2E PostgreSQL
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v
