# Application
spring:
  application:
    name: auth-service

  # PostgreSQL datasource
  datasource:
    url: jdbc:postgresql://localhost:${AUTH_DB_PORT:5433}/${AUTH_DB_NAME:pos_identity_db}
    username: ${AUTH_DB_USER:${POSTGRES_USER:pos_admin}}
    password: ${AUTH_DB_PASSWORD:${POSTGRES_PASSWORD:pos_password123}}
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false

  # Using for seeding datas (dev enabled by default for local runs; overridden in tests/prod)
  profiles:
    default: dev

# Server
server:
  port: ${AUTH_SERVER_PORT:8081}

# Logging
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId:-no-cid}] %logger{36} - %msg%n"
  level:
    org.springframework: INFO
    com.smart_pos.auth: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health, info

# JWT
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
    refresh-token-expiration-days: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:7}
    refresh-cookie-name: ${JWT_REFRESH_COOKIE_NAME:refreshToken}
    cookie-secure: ${JWT_COOKIE_SECURE:false}

  seed:
    admin-username: ${SEED_ADMIN_USERNAME:admin}
    admin-password: ${SEED_ADMIN_PASSWORD:12345678}
    admin-full-name: System Administrator
    admin-phone: ${SEED_ADMIN_PHONE:0123456789}
