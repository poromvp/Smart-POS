# Application
spring:
  application:
    name: auth-service

  # PostgreSQL datasource
  datasource:
    url: jdbc:postgresql://localhost:${AUTH_DB_PORT:5433}/${AUTH_DB_NAME:auth_db}
    username: ${AUTH_DB_USER:auth_user}
    password: ${AUTH_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  # Using for seeding datas
#  profiles:
#    active: dev

# Server
server:
  port: ${AUTH_SERVER_PORT:8081}

# Logging
logging:
  level:
    org.springframework: INFO
    com.smart_pos.auth: DEBUG

# JWT
app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
    refresh-token-expiration-days: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:7}
    refresh-cookie-name: ${JWT_REFRESH_COOKIE_NAME:refreshToken}

  seed:
    admin-username: ${SEED_ADMIN_USERNAME:admin}
    admin-password: ${SEED_ADMIN_PASSWORD:12345678}
    admin-full-name: System Administrator
    admin-phone: ${SEED_ADMIN_PHONE:0123456789}