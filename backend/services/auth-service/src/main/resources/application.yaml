# Application
spring:
  application:
    name: auth-service

  # PostgreSQL datasource
  datasource:
    url: jdbc:postgresql://localhost:${AUTH_DB_PORT:5433}/${AUTH_DB_NAME:auth_db}
    username: ${AUTH_DB_USER:auth_user}
    password: ${AUTH_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

# Server
server:
  port: ${AUTH_SERVER_PORT:8081}

# Logging
logging:
  level:
    org.springframework: INFO
    com.smart_pos.auth: DEBUG

# JWT
app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 900000
    refresh-token-expiration: 604800000