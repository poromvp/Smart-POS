server:
  port: 8082 # Port gợi ý: Identity (8081), Catalog-Inventory (8082), Sales (8083)

spring:
  application:
    name: catalog-inventory-service

  # Cấu hình giới hạn dung lượng upload file
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: jdbc:postgresql://localhost:5433/pos_catalog_inventory_db
    username: ${POSTGRES_USER:pos_admin}
    password: ${POSTGRES_PASSWORD:123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

# Cấu hình biến tùy chỉnh cho ứng dụng (cùng cấp với server và spring)
app:
  upload:
    dir: uploads/products/ # Thư mục lưu ảnh trên máy tính
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
