server:
  port: ${PORT:8083}

spring:
  application:
    name: sales-service

  datasource:
    url: ${SALES_DB_URL:jdbc:postgresql://127.0.0.1:5433/pos_sales_db}
    username: ${POSTGRES_USER:pos_admin}
    password: ${POSTGRES_PASSWORD:123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Mặc định là update để tự động sinh/cập nhật bảng lúc phát triển, có thể set JPA_DDL_AUTO=validate khi chạy production
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

# Cấu hình kết nối liên dịch vụ nội bộ
app:
  services:
    catalog-inventory-url: ${CATALOG_INVENTORY_URL:http://localhost:8082}

# Cấu hình Swagger / OpenAPI Docs
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html