spring:
  datasource:
    url: jdbc:h2:mem:sales_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  services:
    catalog-inventory-url: http://localhost:8082

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
