services:
  postgres:
    image: postgres:16-alpine
    container_name: smartpos-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pos_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pos_password123}
    ports:
      - "5433:5432"
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pos_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartpos-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: smartpos-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@smartpos.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - smartpos-net

  gateway:
    build:
      context: ./backend
      dockerfile: gateway/Dockerfile
    container_name: smartpos-gateway
    restart: unless-stopped
    ports:
      - "${PORT:-8088}:8088"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 8088
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      AUTH_SERVICE_URL: ${DOCKER_AUTH_SERVICE_URL:-http://host.docker.internal:8081}
      CATALOG_INVENTORY_URL: ${DOCKER_CATALOG_INVENTORY_URL:-http://host.docker.internal:8082}
      SALES_SERVICE_URL: ${DOCKER_SALES_SERVICE_URL:-http://host.docker.internal:8083}
      SALES_WS_URL: ${DOCKER_SALES_WS_URL:-http://host.docker.internal:8083}
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*,http://127.0.0.1:*}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_TRUST_FORWARDED_HEADERS: ${RATE_LIMIT_TRUST_FORWARDED_HEADERS:-false}
      FORWARD_HEADERS_STRATEGY: ${FORWARD_HEADERS_STRATEGY:-none}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8088/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 25s
      retries: 3
    networks:
      - smartpos-net

volumes:
  postgres_data:

networks:
  smartpos-net:
    driver: bridge
