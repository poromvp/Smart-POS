services:
  postgres:
    image: postgres:16-alpine
    container_name: smartpos-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pos_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pos_password123}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pos_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartpos-net

  auth-service:
    build:
      context: ./backend
      dockerfile: services/auth-service/Dockerfile
    container_name: smartpos-auth-prod
    restart: unless-stopped
    environment:
      AUTH_SERVER_PORT: 8081
      AUTH_DB_URL: jdbc:postgresql://postgres:5432/pos_identity_db
      AUTH_DB_USER: ${POSTGRES_USER:-pos_admin}
      AUTH_DB_PASSWORD: ${POSTGRES_PASSWORD:-pos_password123}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION:-900000}
      JWT_REFRESH_TOKEN_EXPIRATION_DAYS: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:-7}
      JAVA_TOOL_OPTIONS: "-Xms96m -Xmx256m -XX:+TieredCompilation -XX:TieredStopAtLevel=1"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - smartpos-net

  catalog-inventory-service:
    build:
      context: ./backend
      dockerfile: services/catalog-inventory-service/Dockerfile
    container_name: smartpos-catalog-prod
    restart: unless-stopped
    environment:
      PORT: 8082
      CATALOG_DB_URL: jdbc:postgresql://postgres:5432/pos_catalog_inventory_db
      POSTGRES_USER: ${POSTGRES_USER:-pos_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pos_password123}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-smartpos-internal-secret-2026}
      CORS_ALLOWED_ORIGINS: "*"
      JAVA_TOOL_OPTIONS: "-Xms96m -Xmx256m -XX:+TieredCompilation -XX:TieredStopAtLevel=1"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - smartpos-net

  sales-service:
    build:
      context: ./backend
      dockerfile: services/sales-service/Dockerfile
    container_name: smartpos-sales-prod
    restart: unless-stopped
    environment:
      PORT: 8083
      SALES_DB_URL: jdbc:postgresql://postgres:5432/pos_sales_db
      POSTGRES_USER: ${POSTGRES_USER:-pos_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pos_password123}
      CATALOG_INVENTORY_URL: http://catalog-inventory-service:8082
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-smartpos-internal-secret-2026}
      JAVA_TOOL_OPTIONS: "-Xms96m -Xmx256m -XX:+TieredCompilation -XX:TieredStopAtLevel=1"
    depends_on:
      postgres:
        condition: service_healthy
      catalog-inventory-service:
        condition: service_started
    networks:
      - smartpos-net

  gateway:
    build:
      context: ./backend
      dockerfile: gateway/Dockerfile
    container_name: smartpos-gateway-prod
    restart: unless-stopped
    environment:
      PORT: 8088
      AUTH_SERVICE_URL: http://auth-service:8081
      CATALOG_INVENTORY_URL: http://catalog-inventory-service:8082
      SALES_SERVICE_URL: http://sales-service:8083
      SALES_WS_URL: http://sales-service:8083
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      CORS_ALLOWED_ORIGIN_PATTERNS: "*"
      RATE_LIMIT_ENABLED: "false"
      RATE_LIMIT_TRUST_FORWARDED_HEADERS: "true"
      FORWARD_HEADERS_STRATEGY: framework
      JAVA_TOOL_OPTIONS: "-Xms96m -Xmx256m -XX:+TieredCompilation -XX:TieredStopAtLevel=1"
    depends_on:
      auth-service:
        condition: service_started
      catalog-inventory-service:
        condition: service_started
      sales-service:
        condition: service_started
    networks:
      - smartpos-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartpos-frontend-prod
    restart: unless-stopped
    environment:
      PORT: 3000
      API_GATEWAY_URL: http://gateway:8088
    depends_on:
      gateway:
        condition: service_started
    networks:
      - smartpos-net

  nginx:
    image: nginx:alpine
    container_name: smartpos-nginx-prod
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_started
      gateway:
        condition: service_started
    networks:
      - smartpos-net

volumes:
  postgres_prod_data:

networks:
  smartpos-net:
    driver: bridge
