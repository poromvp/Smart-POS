services:
  postgres:
    image: postgres:16-alpine
    container_name: smartpos-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pos_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pos_password123}
    ports:
      - "5433:5432"
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - smartpos-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: smartpos-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@smartpos.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - smartpos-net

volumes:
  postgres_data:

networks:
  smartpos-net:
    driver: bridge
