services:
  smart-pos-db:
    image: postgres:16-alpine
    container_name: smart-pos-db
    restart: "no"
    environment:
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - ./init-scripts:/docker-entrypoint-initdb.d/
      - pos_db_data:/var/lib/postgresql/data

volumes:
  pos_db_data: